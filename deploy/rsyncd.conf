# A TÁVOLI gépre: ~/.config/aither-relay/rsyncd.conf
# Csak a forrásszerver IP-címéről fogad kapcsolatot, jelszóval.
lock file = /home/USER/.config/aither-relay/rsyncd.lock
pid file = /home/USER/.config/aither-relay/rsyncd.pid
log file = /home/USER/.config/aither-relay/rsyncd.log
port = 8730
use chroot = no
max connections = 8

[relay]
    path = /home/USER/torrents/qbittorrent
    read only = false
    list = false
    hosts allow = SOURCE_SERVER_IP
    hosts deny = *
    auth users = relay
    secrets file = /home/USER/.config/aither-relay/rsyncd.secrets
